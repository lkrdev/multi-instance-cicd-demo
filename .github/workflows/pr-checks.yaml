name: PR Checks & Validation Gates

on:
  pull_request:
    branches: [main]

jobs:
  lams-lint:
    name: LAMS LookML Style Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run LAMS Style Linter
        run: npx -y @looker/look-at-me-sideways@5 --reporting=no --output=lines

  dev-lookml-validation:
    name: Dev LookML Syntax & Unit Tests (Looker CLI)
    runs-on: ubuntu-latest
    needs: [lams-lint]
    env:
      LOOKER_DEV_BASE_URL: ${{ secrets.LOOKER_DEV_BASE_URL }}
      LOOKER_DEV_CLIENT_ID: ${{ secrets.LOOKER_DEV_CLIENT_ID }}
      LOOKER_DEV_CLIENT_SECRET: ${{ secrets.LOOKER_DEV_CLIENT_SECRET }}
      LOOKER_PROJECT_ID: ${{ vars.LOOKER_PROJECT_ID || 'multi-instance-cicd-demo' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Looker CLI
        run: |
          go install github.com/looker-open-source/looker-cli/cmd/looker-cli@latest

      - name: Login and Setup Dev Mode Session on Dev
        run: |
          looker-cli session login \
            --host "${{ env.LOOKER_DEV_BASE_URL }}" \
            --port 443 \
            --client-id "${{ env.LOOKER_DEV_CLIENT_ID }}" \
            --client-secret "${{ env.LOOKER_DEV_CLIENT_SECRET }}"

          echo '{"workspace_id":"dev"}' | looker-cli api session update_session - \
            --token-file \
            --host "${{ env.LOOKER_DEV_BASE_URL }}" \
            --port 443

      - name: Checkout PR Branch in Dev Mode
        run: |
          looker-cli project checkout "${{ env.LOOKER_PROJECT_ID }}" "${{ github.head_ref }}" \
            --token-file \
            --host "${{ env.LOOKER_DEV_BASE_URL }}" \
            --port 443

      - name: Validate LookML Project
        run: |
          looker-cli project validate "${{ env.LOOKER_PROJECT_ID }}" \
            --token-file \
            --host "${{ env.LOOKER_DEV_BASE_URL }}" \
            --port 443

      - name: Run LookML Unit Tests
        run: |
          looker-cli api project run_lookml_test "${{ env.LOOKER_PROJECT_ID }}" \
            --token-file \
            --host "${{ env.LOOKER_DEV_BASE_URL }}" \
            --port 443

  stage-impact-checks:
    name: Stage Pre-Merge Content Impact (Looker CLI)
    runs-on: ubuntu-latest
    needs: [lams-lint]
    env:
      LOOKER_STAGE_BASE_URL: ${{ secrets.LOOKER_STAGE_BASE_URL }}
      LOOKER_STAGE_CLIENT_ID: ${{ secrets.LOOKER_STAGE_CLIENT_ID }}
      LOOKER_STAGE_CLIENT_SECRET: ${{ secrets.LOOKER_STAGE_CLIENT_SECRET }}
      LOOKER_PROJECT_ID: ${{ vars.LOOKER_PROJECT_ID || 'multi-instance-cicd-demo' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Looker CLI
        run: |
          go install github.com/looker-open-source/looker-cli/cmd/looker-cli@latest

      - name: Login and Setup Dev Mode Session on Stage
        run: |
          looker-cli session login \
            --host "${{ env.LOOKER_STAGE_BASE_URL }}" \
            --port 443 \
            --client-id "${{ env.LOOKER_STAGE_CLIENT_ID }}" \
            --client-secret "${{ env.LOOKER_STAGE_CLIENT_SECRET }}"

          echo '{"workspace_id":"dev"}' | looker-cli api session update_session - \
            --token-file \
            --host "${{ env.LOOKER_STAGE_BASE_URL }}" \
            --port 443

      - name: Checkout PR Branch on Stage
        run: |
          looker-cli project checkout "${{ env.LOOKER_PROJECT_ID }}" "${{ github.head_ref }}" \
            --token-file \
            --host "${{ env.LOOKER_STAGE_BASE_URL }}" \
            --port 443

      - name: Run Content Validator on Stage
        run: |
          looker-cli api content content_validation \
            --project_names "${{ env.LOOKER_PROJECT_ID }}" \
            --token-file \
            --host "${{ env.LOOKER_STAGE_BASE_URL }}" \
            --port 443
