name: Release to Production

on:
  release:
    types: [created]

jobs:
  prod-preflight-validation:
    name: Production Pre-Flight Validation (Looker CLI Dev Mode)
    runs-on: ubuntu-latest
    env:
      LOOKER_PROD_BASE_URL: ${{ secrets.LOOKER_PROD_BASE_URL }}
      LOOKER_PROD_CLIENT_ID: ${{ secrets.LOOKER_PROD_CLIENT_ID }}
      LOOKER_PROD_CLIENT_SECRET: ${{ secrets.LOOKER_PROD_CLIENT_SECRET }}
      LOOKER_PROJECT_ID: ${{ vars.LOOKER_PROJECT_ID || 'multi_instance_cicd_demo' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Looker CLI
        run: |
          go install github.com/looker-open-source/looker-cli/cmd/looker-cli@latest

      - name: Login and Switch Prod Session to Dev Mode
        run: |
          looker-cli session login \
            --host "${{ env.LOOKER_PROD_BASE_URL }}" \
            --port 443 \
            --client-id "${{ env.LOOKER_PROD_CLIENT_ID }}" \
            --client-secret "${{ env.LOOKER_PROD_CLIENT_SECRET }}"

          looker-cli session update_session '{"workspace_id":"dev"}' \
            --token-file \
            --host "${{ env.LOOKER_PROD_BASE_URL }}" \
            --port 443

      - name: Checkout Release Tag in Dev Mode
        run: |
          looker-cli project checkout "${{ env.LOOKER_PROJECT_ID }}" "${{ github.event.release.tag_name }}" \
            --token-file \
            --host "${{ env.LOOKER_PROD_BASE_URL }}" \
            --port 443

      - name: Validate LookML Project
        run: |
          looker-cli project validate "${{ env.LOOKER_PROJECT_ID }}" \
            --token-file \
            --host "${{ env.LOOKER_PROD_BASE_URL }}" \
            --port 443

      - name: Run Content Validator in Dev Mode
        run: |
          looker-cli api content_validator run_content_validator \
            "{\"project_names\": [\"${{ env.LOOKER_PROJECT_ID }}\"]}" \
            --token-file \
            --host "${{ env.LOOKER_PROD_BASE_URL }}" \
            --port 443

  deploy-to-prod:
    name: Advanced Deploy Tag to Prod (Looker CLI API)
    runs-on: ubuntu-latest
    needs: [prod-preflight-validation]
    env:
      LOOKER_PROD_BASE_URL: ${{ secrets.LOOKER_PROD_BASE_URL }}
      LOOKER_PROD_CLIENT_ID: ${{ secrets.LOOKER_PROD_CLIENT_ID }}
      LOOKER_PROD_CLIENT_SECRET: ${{ secrets.LOOKER_PROD_CLIENT_SECRET }}
      LOOKER_PROJECT_ID: ${{ vars.LOOKER_PROJECT_ID || 'multi_instance_cicd_demo' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Looker CLI
        run: |
          go install github.com/looker-open-source/looker-cli/cmd/looker-cli@latest

      - name: Login and Deploy Release Tag to Prod via Looker CLI API
        run: |
          looker-cli session login \
            --host "${{ env.LOOKER_PROD_BASE_URL }}" \
            --port 443 \
            --client-id "${{ env.LOOKER_PROD_CLIENT_ID }}" \
            --client-secret "${{ env.LOOKER_PROD_CLIENT_SECRET }}"

          looker-cli api project deploy_ref_to_production "${{ env.LOOKER_PROJECT_ID }}" \
            --ref "tags/${{ github.event.release.tag_name }}" \
            --token-file \
            --host "${{ env.LOOKER_PROD_BASE_URL }}" \
            --port 443

  verify-settings-parity:
    name: Verify Stage vs Prod Settings Parity (Before Content Migration)
    runs-on: ubuntu-latest
    needs: [deploy-to-prod]
    env:
      LOOKER_STAGE_BASE_URL: ${{ secrets.LOOKER_STAGE_BASE_URL }}
      LOOKER_STAGE_CLIENT_ID: ${{ secrets.LOOKER_STAGE_CLIENT_ID }}
      LOOKER_STAGE_CLIENT_SECRET: ${{ secrets.LOOKER_STAGE_CLIENT_SECRET }}
      LOOKER_PROD_BASE_URL: ${{ secrets.LOOKER_PROD_BASE_URL }}
      LOOKER_PROD_CLIENT_ID: ${{ secrets.LOOKER_PROD_CLIENT_ID }}
      LOOKER_PROD_CLIENT_SECRET: ${{ secrets.LOOKER_PROD_CLIENT_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Looker CLI
        run: |
          go install github.com/looker-open-source/looker-cli/cmd/looker-cli@latest

      - name: Export Stage Settings
        run: |
          looker-cli session login \
            --host "${{ env.LOOKER_STAGE_BASE_URL }}" \
            --port 443 \
            --client-id "${{ env.LOOKER_STAGE_CLIENT_ID }}" \
            --client-secret "${{ env.LOOKER_STAGE_CLIENT_SECRET }}"

          looker-cli api config get_setting \
            --token-file \
            --host "${{ env.LOOKER_STAGE_BASE_URL }}" \
            --port 443 | jq -S 'del(.host_url, .instance_config)' > stage_settings.json

      - name: Export Prod Settings
        run: |
          looker-cli session login \
            --host "${{ env.LOOKER_PROD_BASE_URL }}" \
            --port 443 \
            --client-id "${{ env.LOOKER_PROD_CLIENT_ID }}" \
            --client-secret "${{ env.LOOKER_PROD_CLIENT_SECRET }}"

          looker-cli api config get_setting \
            --token-file \
            --host "${{ env.LOOKER_PROD_BASE_URL }}" \
            --port 443 | jq -S 'del(.host_url, .instance_config)' > prod_settings.json

      - name: Diff Stage and Prod Settings
        run: |
          echo "Comparing Stage vs Prod settings before content migration..."
          diff -u stage_settings.json prod_settings.json

  promote-stage-content-to-prod:
    name: Promote Whitelisted UDDs & Boards (Stage > Prod)
    runs-on: ubuntu-latest
    needs: [verify-settings-parity]
    env:
      LOOKER_STAGE_BASE_URL: ${{ secrets.LOOKER_STAGE_BASE_URL }}
      LOOKER_STAGE_CLIENT_ID: ${{ secrets.LOOKER_STAGE_CLIENT_ID }}
      LOOKER_STAGE_CLIENT_SECRET: ${{ secrets.LOOKER_STAGE_CLIENT_SECRET }}
      LOOKER_PROD_BASE_URL: ${{ secrets.LOOKER_PROD_BASE_URL }}
      LOOKER_PROD_CLIENT_ID: ${{ secrets.LOOKER_PROD_CLIENT_ID }}
      LOOKER_PROD_CLIENT_SECRET: ${{ secrets.LOOKER_PROD_CLIENT_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Looker CLI
        run: |
          go install github.com/looker-open-source/looker-cli/cmd/looker-cli@latest

      - name: Export and Import Whitelisted Folders (Stage > Prod via Looker CLI)
        run: |
          mkdir -p ./content_export

          # Login to Stage and export whitelisted folders
          looker-cli session login \
            --host "${{ env.LOOKER_STAGE_BASE_URL }}" \
            --port 443 \
            --client-id "${{ env.LOOKER_STAGE_CLIENT_ID }}" \
            --client-secret "${{ env.LOOKER_STAGE_CLIENT_SECRET }}"

          FOLDERS=$(grep -E '^[[:space:]]*-' config/content_folders_whitelist.yaml | sed 's/^[[:space:]]*-[[:space:]]*//; s/"//g; s/'\''//g')

          for FOLDER in $FOLDERS; do
            echo "Exporting folder '$FOLDER' from Stage..."
            looker-cli folder export "$FOLDER" \
              --dir "./content_export/$FOLDER" \
              --token-file \
              --host "${{ env.LOOKER_STAGE_BASE_URL }}" \
              --port 443 || echo "Notice: folder $FOLDER not found on Stage"
          done

          # Login to Prod and import exported folders into Shared (folder ID 1)
          looker-cli session login \
            --host "${{ env.LOOKER_PROD_BASE_URL }}" \
            --port 443 \
            --client-id "${{ env.LOOKER_PROD_CLIENT_ID }}" \
            --client-secret "${{ env.LOOKER_PROD_CLIENT_SECRET }}"

          for FOLDER in $FOLDERS; do
            if [ -d "./content_export/$FOLDER" ]; then
              echo "Importing folder '$FOLDER' into Prod Shared space..."
              looker-cli folder import "./content_export/$FOLDER" 1 \
                --token-file \
                --host "${{ env.LOOKER_PROD_BASE_URL }}" \
                --port 443
            fi
          done

      - name: Promote Whitelisted Boards (Stage > Prod via Looker CLI)
        run: |
          bash scripts/migrate_boards_cli.sh config/content_boards_whitelist.yaml
