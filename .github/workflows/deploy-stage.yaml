name: Deploy to Stage (UAT)

on:
  push:
    branches: [main]

jobs:
  deploy-to-stage:
    name: Advanced Deploy to Stage (Looker CLI API)
    runs-on: ubuntu-latest
    env:
      LOOKER_STAGE_BASE_URL: ${{ secrets.LOOKER_STAGE_BASE_URL }}
      LOOKER_STAGE_CLIENT_ID: ${{ secrets.LOOKER_STAGE_CLIENT_ID }}
      LOOKER_STAGE_CLIENT_SECRET: ${{ secrets.LOOKER_STAGE_CLIENT_SECRET }}
      LOOKER_PROJECT_ID: ${{ vars.LOOKER_PROJECT_ID || 'multi-instance-cicd-demo' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Looker CLI
        run: |
          go install github.com/looker-open-source/looker-cli/cmd/looker-cli@latest

      - name: Login and Deploy Ref to Stage via Looker CLI API
        run: |
          looker-cli session login \
            --host "${{ env.LOOKER_STAGE_BASE_URL }}" \
            --port 443 \
            --client-id "${{ env.LOOKER_STAGE_CLIENT_ID }}" \
            --client-secret "${{ env.LOOKER_STAGE_CLIENT_SECRET }}"

          looker-cli api project deploy_ref_to_production "${{ env.LOOKER_PROJECT_ID }}" \
            --ref "${{ github.sha }}" \
            --token-file \
            --host "${{ env.LOOKER_STAGE_BASE_URL }}" \
            --port 443

      - name: Verify LookML User Attributes on Stage
        run: |
          STATUS_FILE=stage_user_attributes_status.json \
            bash scripts/check_user_attributes_cli.sh "${{ env.LOOKER_STAGE_BASE_URL }}"

      - name: Upload Stage User Attributes Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-user-attributes-status
          path: stage_user_attributes_status.json

  verify-settings-parity:
    name: Verify Stage vs Prod Settings & User Attribute Parity (Looker CLI Diff)
    runs-on: ubuntu-latest
    needs: [deploy-to-stage]
    env:
      LOOKER_STAGE_BASE_URL: ${{ secrets.LOOKER_STAGE_BASE_URL }}
      LOOKER_STAGE_CLIENT_ID: ${{ secrets.LOOKER_STAGE_CLIENT_ID }}
      LOOKER_STAGE_CLIENT_SECRET: ${{ secrets.LOOKER_STAGE_CLIENT_SECRET }}
      LOOKER_PROD_BASE_URL: ${{ secrets.LOOKER_PROD_BASE_URL }}
      LOOKER_PROD_CLIENT_ID: ${{ secrets.LOOKER_PROD_CLIENT_ID }}
      LOOKER_PROD_CLIENT_SECRET: ${{ secrets.LOOKER_PROD_CLIENT_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Looker CLI
        run: |
          go install github.com/looker-open-source/looker-cli/cmd/looker-cli@latest

      - name: Export Stage Settings
        run: |
          looker-cli session login \
            --host "${{ env.LOOKER_STAGE_BASE_URL }}" \
            --port 443 \
            --client-id "${{ env.LOOKER_STAGE_CLIENT_ID }}" \
            --client-secret "${{ env.LOOKER_STAGE_CLIENT_SECRET }}"

          looker-cli api config get_setting \
            --token-file \
            --host "${{ env.LOOKER_STAGE_BASE_URL }}" \
            --port 443 | jq -S 'del(.host_url, .instance_config)' > stage_settings.json

      - name: Export Prod Settings
        run: |
          looker-cli session login \
            --host "${{ env.LOOKER_PROD_BASE_URL }}" \
            --port 443 \
            --client-id "${{ env.LOOKER_PROD_CLIENT_ID }}" \
            --client-secret "${{ env.LOOKER_PROD_CLIENT_SECRET }}"

          looker-cli api config get_setting \
            --token-file \
            --host "${{ env.LOOKER_PROD_BASE_URL }}" \
            --port 443 | jq -S 'del(.host_url, .instance_config)' > prod_settings.json

      - name: Diff Stage and Prod Settings
        run: |
          echo "Comparing Stage vs Prod settings..."
          diff -u stage_settings.json prod_settings.json

      - name: Verify LookML and Stage vs Prod User Attributes Parity
        run: |
          STATUS_FILE=stage_prod_user_attributes_status.json \
            bash scripts/check_user_attributes_cli.sh "${{ env.LOOKER_PROD_BASE_URL }}" "${{ env.LOOKER_STAGE_BASE_URL }}"

      - name: Upload Stage vs Prod User Attributes Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-prod-user-attributes-status
          path: stage_prod_user_attributes_status.json

      - name: Verify Stage vs Prod Custom Visualizations Parity
        run: |
          STATUS_FILE=stage_prod_custom_visualizations_status.json \
            bash scripts/check_custom_visualizations_cli.sh "${{ env.LOOKER_PROD_BASE_URL }}" "${{ env.LOOKER_STAGE_BASE_URL }}"

      - name: Upload Stage vs Prod Custom Visualizations Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-prod-custom-visualizations-status
          path: stage_prod_custom_visualizations_status.json
